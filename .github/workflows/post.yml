name: Instagram post

on:
  schedule:
    # время в UTC: 06:00 и 11:00 UTC = 09:00 и 14:00 по Москве, картинка
    - cron: "0 6,11 * * *"
    # 16:00 UTC = 19:00 по Москве, ролик Reels
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "auto, news или fact"
        default: "auto"
      format:
        description: "photo (картинка) или reel (ролик)"
        default: "photo"
      publish:
        description: "Опубликовать в Instagram этот запуск"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: instagram-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Шрифт Montserrat
        # если шрифт не скачался, бот возьмёт системный DejaVu
        run: |
          mkdir -p fonts
          curl -fsSLo fonts/Montserrat-Bold.ttf https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-Bold.ttf || rm -f fonts/Montserrat-Bold.ttf
          curl -fsSLo fonts/Montserrat-Medium.ttf https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-Medium.ttf || rm -f fonts/Montserrat-Medium.ttf
      - name: Пост
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5' }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_HOST: ${{ vars.IMAGE_HOST || 'github' }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          # аккаунт, куда публикуем; бот сверяет с ним токен и пишет его на картинке
          CHANNEL_HANDLE: "@bucho2"
          # пока переменная PUBLISH не равна true, бот только готовит посты
          PUBLISH: ${{ inputs.publish && 'true' || vars.PUBLISH || 'false' }}
          FORMAT: ${{ inputs.format || (github.event.schedule == '0 16 * * *' && 'reel' || 'photo') }}
        run: python main.py --kind "${{ inputs.kind || 'auto' }}" --format "$FORMAT"
      - name: Сохранить картинку для просмотра
        uses: actions/upload-artifact@v4
        with:
          name: post
          path: output/
      - name: Сохранить историю постов
        run: |
          git config user.name "instagram-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data
          git commit -m "history update" || echo "нет изменений"
          git pull --rebase
          git push
