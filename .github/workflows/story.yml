name: Story from last post

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: instagram-post

jobs:
  story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Шрифт Montserrat
        run: |
          mkdir -p fonts
          curl -fsSLo fonts/Montserrat-Bold.ttf https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-Bold.ttf || rm -f fonts/Montserrat-Bold.ttf
          curl -fsSLo fonts/Montserrat-Medium.ttf https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-Medium.ttf || rm -f fonts/Montserrat-Medium.ttf
      - name: Сторис
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          CHANNEL_HANDLE: "@bucho2"
        run: python story_last.py
      - name: Сохранить историю
        run: |
          git config user.name "instagram-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data
          git commit -m "story" || echo "нет изменений"
          git pull --rebase
          git push
