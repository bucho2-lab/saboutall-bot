name: Week facts

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: instagram-post

jobs:
  facts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python week_facts.py
      - name: Сохранить
        run: |
          git config user.name "instagram-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/week_facts.json
          git commit -m "События на неделю" || echo "нет изменений"
          git pull --rebase
          git push
